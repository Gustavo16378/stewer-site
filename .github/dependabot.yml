# Atualizações de segurança automáticas: o Dependabot abre um pull request
# quando sai versão nova de uma dependência ou de uma Action, e a CI roda a
# bateria inteira nele antes de qualquer merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
      producao:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
