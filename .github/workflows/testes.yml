name: testes

# Roda a pirâmide inteira a cada push e pull request na main:
# dependências → tipos → unitários → banco → API → segurança → E2E e acessibilidade.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Auditoria de dependências (A06, nada vulnerável no que vai para produção)
        run: npm run auditoria

      - name: Build (inclui checagem de tipos do site, do painel e da API)
        run: npm run build

      - name: Unitários (caixa branca) com cobertura
        run: npx vitest run --project unit --coverage

      - name: Banco (schema, constraints, migrations)
        run: npm run test:db

      - name: API (contrato, integração, concorrência) e segurança (OWASP Top 10)
        run: npm run test:api

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E e acessibilidade
        run: npm run test:e2e

      - name: Relatório do E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: |
            tests/relatorio-e2e/
            test-results/
          retention-days: 7
